name: Pages

# Publishes the presentation page in site/ to GitHub Pages. It runs on pushes
# to dev, the default branch, that change the page, and on demand. The page is
# static: no build step, the folder is published as it is. GitHub Pages must
# use "GitHub Actions" as its source (Settings › Pages).
on:
  push:
    branches: [dev]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
