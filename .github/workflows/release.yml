name: Release

# Every push to main publishes a release: the version follows the
# Conventional Commits since the last v* tag (scripts/release/next-version.sh).
on:
  push:
    branches: [main]

permissions:
  contents: write # create the tag and the release

# One release at a time; a push waiting behind another is released with it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history and its tags, for the version and the notes
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go -C backend mod download
      - run: npm --prefix frontend ci
      # systemd-journal-remote writes the journal files of the journalctl
      # integration tests; dbus-daemon runs the private bus of the fake
      # systemd (adapters/systemd), whose tests are skipped without it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends systemd-journal-remote dbus
      - run: command -v dbus-daemon

      - name: Verify
        run: scripts/verify.sh

      # No release with a known vulnerability in the dependencies or the Go
      # standard library (docs/CODE_RULES.md § 6).
      - name: Install the audit tools
        run: |
          scripts/install-audit-tools.sh
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Audit the dependencies
        run: scripts/audit.sh

      - name: Compute the version
        id: version
        run: echo "version=$(scripts/release/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build the archives
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/build.sh "$VERSION" dist

      - name: Write the release notes
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/release/notes.sh "$VERSION" "$REPOSITORY_URL" > notes.md

      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "MonoOps v$VERSION" \
            --notes-file notes.md
