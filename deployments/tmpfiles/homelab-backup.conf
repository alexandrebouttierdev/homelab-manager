# Homelab Manager: files exchanged between the Manager and
# homelab-backup@.service (SPEC_ADMINISTRATION.md § 7.1). The Manager writes
# the jobs and their one-use secrets files (0600), which root reads; the
# runner writes the results, which the Manager reads through its group.
# Install in /etc/tmpfiles.d/ and run
# "systemd-tmpfiles --create homelab-backup.conf".
d /var/lib/homelab-backup      0755 root            root            -
d /var/lib/homelab-backup/jobs 0700 homelab-manager homelab-manager -
d /var/lib/homelab-backup/runs 2750 root            homelab-manager -
# Quarantine of the restores, one directory per run, for root only: an
# administrator copies the files back by hand (SPEC_ADMINISTRATION.md § 7.4).
d /var/lib/homelab-backup/restore 0700 root         root            -
