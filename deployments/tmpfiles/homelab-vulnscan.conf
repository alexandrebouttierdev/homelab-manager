# Homelab Manager: files exchanged between the Manager and
# homelab-vulnscan.service (SPEC_ADMINISTRATION.md § 8 ter.2). The Manager
# writes the inventory, the unit reads it through its group; the unit
# writes the result, the Manager reads it through its group. Neither
# account joins the group of the other. Install in /etc/tmpfiles.d/ and run
# "systemd-tmpfiles --create homelab-vulnscan.conf".
d /var/lib/homelab-vulnscan           0755 root             root             -
d /var/lib/homelab-vulnscan/inventory 2750 homelab-manager  homelab-vulnscan -
d /var/lib/homelab-vulnscan/result    2750 homelab-vulnscan homelab-manager  -
