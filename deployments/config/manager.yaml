http_address: ":8080"
database_path: "/var/lib/homelab-manager/homelab-manager.db"
tls_cert_file: ""
tls_key_file: ""
docker_proxy_socket: "/run/homelab-docker-proxy/docker.sock"
web_root: "/opt/homelab-manager/frontend/dist"
system_collect_interval_seconds: 10
docker_collect_interval_seconds: 15
docker_discovery_interval_seconds: 30
metrics_retention_days: 7
# Redémarrer et éteindre la machine depuis l'interface : exige aussi la règle
# polkit deployments/polkit/50-homelab-manager-power.rules (voir README).
power_actions_enabled: false
# Clé maître du coffre de secrets (TOTP). Vide : la clé importée par systemd
# (ImportCredential=homelab-manager-secrets-key, voir README).
secrets_key_file: ""
# Vulnérabilités des paquets (module V) : intervalle des scans automatiques
# (6 à 168 h) et fichiers échangés avec l'unité homelab-vulnscan.service
# (créés par deployments/tmpfiles/homelab-vulnscan.conf, voir README).
vulnerability_scan_interval_hours: 24
vulnscan_inventory_path: "/var/lib/homelab-vulnscan/inventory/inventory.json"
vulnscan_result_path: "/var/lib/homelab-vulnscan/result/result.json"
