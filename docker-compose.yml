services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: homelab_manager
      POSTGRES_USER: homelab_manager
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - homelab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab_manager -d homelab_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  homelab-postgres:
