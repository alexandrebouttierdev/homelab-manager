# MonoOps: files exchanged between the Manager and
# monoops-vulnscan.service (SPEC_ADMINISTRATION.md § 8 ter.2). The Manager
# writes the inventory, the unit reads it through its group; the unit
# writes the result, the Manager reads it through its group. Neither
# account joins the group of the other. Install in /etc/tmpfiles.d/ and run
# "systemd-tmpfiles --create monoops-vulnscan.conf".
d /var/lib/monoops-vulnscan           0755 root             root             -
d /var/lib/monoops-vulnscan/inventory 2750 monoops  monoops-vulnscan -
d /var/lib/monoops-vulnscan/result    2750 monoops-vulnscan monoops  -
