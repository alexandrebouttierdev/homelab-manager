# Homelab Manager: an in-place restore (decision D-2) writes the restored
# files where they were, outside the directories of the template. /usr,
# /boot, /efi and /etc stay read-only (ProtectSystem=full); the Manager also
# refuses those paths, the virtual file systems and its own state.
#
# Install as root:root 0644 in
# /etc/systemd/system/homelab-backup@restore-in-place.service.d/ then run
# "systemctl daemon-reload".
[Service]
ProtectSystem=full
ProtectHome=false
